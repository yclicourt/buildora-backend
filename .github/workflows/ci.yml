name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://buildora:buildora@localhost:5432/buildora
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: buildora
          POSTGRES_PASSWORD: buildora
          POSTGRES_DB: buildora
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Sin este paso el build falla: el cliente de Prisma se genera
      # en src/shared/database/generated y no se commitea.
      - run: pnpm exec prisma generate --schema src/shared/database/prisma/schema.prisma
      - run: pnpm build
      # Todavía no hay tests en el repo; sin este flag jest falla
      # con "No tests found" y el CI iría en rojo sin motivo.
      - run: pnpm exec jest --passWithNoTests

services:
  postgres:
    image: postgres:16-alpine
    container_name: buildora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buildora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildora}
      POSTGRES_DB: ${POSTGRES_DB:-buildora}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - buildora-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buildora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: buildora-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - buildora-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  buildora-postgres-data:
  buildora-redis-data: